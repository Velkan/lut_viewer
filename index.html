<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUT Batch Preview</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div class="toolbar-left">
      <h1>LUT 批量预览</h1>
      <span class="badge" id="photo-count">0 照片</span>
      <span class="badge" id="lut-count">0 LUT</span>
    </div>
    <div class="toolbar-right">
      <button class="btn btn-primary" id="btn-photos" title="上传参考照片">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        上传照片
      </button>
      <button class="btn" id="btn-luts" title="打开 LUT 文件 (.cube)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        选择 LUT
      </button>
      <button class="btn" id="btn-toggle-orig" title="切换原图对比">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        未展示原图
      </button>
      <button class="btn" id="btn-clear" title="清空所有">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        清空
      </button>
    </div>
  </header>

  <input type="file" id="photo-input" accept="image/*,.cr2,.cr3,.crw,.nef,.nrw,.arw,.srf,.sr2,.raf,.orf,.rw2,.dng,.pef,.x3f,.3fr,.fff,.rwl,.gpr" multiple hidden>
  <input type="file" id="lut-input" accept=".cube,.3dl,.look" multiple hidden>

  <div id="workspace-row">
    <div class="drop-zone" id="photo-drop-zone">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <p>拖拽照片或<strong>点击上传</strong>（持久化保存）</p>
      <div class="photo-preview-strip" id="photo-strip"></div>
    </div>
    <div class="drop-zone" id="lut-drop-zone">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      <p>拖拽 .cube LUT 文件或<strong>浏览选择</strong></p>
      <span class="hint">最多 999 个 LUT</span>
    </div>
    <div id="fav-section">
      <div class="fav-section-title">★ 收藏</div>
      <div id="fav-list" class="fav-list"><div class="fav-empty">暂无收藏</div></div>
    </div>
  </div>

  <div id="upload-progress-bar" hidden>
    <div class="progress-track upload-track">
      <div class="progress-fill upload-fill" id="upload-progress-fill"></div>
    </div>
    <span class="progress-text" id="upload-progress-text"></span>
  </div>

  <div id="progress-bar" hidden>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="progress-text" id="progress-text">处理中...</span>
  </div>

  <div id="grid-container" hidden>
    <div id="grid-header" class="grid-row grid-header"></div>
    <div id="grid-body"></div>
  </div>

  <footer id="status-bar">
    <span id="status-text">正在加载持久化的照片...</span>
  </footer>


</div>

<script src="js/lut-parser.js?v=1"></script>
<script src="js/webgl-processor.js?v=1"></script>
<script src="js/app.js?v=1"></script>
</body>
</html>
